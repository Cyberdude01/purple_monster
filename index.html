<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#8c5cf6"><title>Purple Buddy</title>
<style>
:root{font-family:system-ui,"Arial Rounded MT Bold",sans-serif;color:#392261}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#fce7ff,#e8ddff 60%,#d3f8ff);display:grid;place-items:center;padding:16px}.app{width:min(100%,460px);background:#ffffffd9;border:4px solid white;border-radius:32px;text-align:center;padding:24px 18px;box-shadow:0 20px 50px #6336a82b}h1{margin:0;font-size:clamp(1.6rem,7vw,2.3rem)}p{font-size:1.14rem} .buddy{height:260px;display:grid;place-items:center;filter:drop-shadow(0 15px 8px #8b62ac44)}svg{width:220px;max-width:100%;height:250px;overflow:visible}.buddy.dance svg{animation:wiggle .38s infinite alternate}.buddy.wave #paw{transform-origin:175px 135px;animation:wave .6s infinite alternate}@keyframes wiggle{from{transform:rotate(-10deg) translateY(0)}to{transform:rotate(10deg) translateY(-12px)}}@keyframes wave{to{transform:rotate(-32deg)}}button,input{font:inherit;border-radius:18px;padding:15px;min-height:56px}button{border:0;background:#7444d9;color:white;font-weight:800;cursor:pointer;font-size:1.05rem}button:focus-visible,input:focus-visible{outline:4px solid #f49a12;outline-offset:3px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.options button{font-size:1.6rem;background:#f0e6ff;color:#402367}.options button span{display:block;font-size:.8rem}input{border:2px solid #a78bdc;width:100%;margin:8px 0 12px;background:white}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.actions button{flex:1;min-width:120px}.secondary{background:#ede4ff;color:#4d3180}#status{min-height:48px;font-weight:650}.small{font-size:.8rem;color:#685c7b;margin-bottom:0}@media(prefers-reduced-motion:reduce){.buddy.dance svg,.buddy.wave #paw{animation:none}}
.options{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:10px}.options button{min-width:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;line-height:1.2;padding:12px 4px;overflow:hidden}.options button span{font-size:clamp(.76rem,3vw,.95rem);overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#games{grid-column:1/-1}.actions button{min-width:0;width:100%;padding:12px 6px;font-size:clamp(.85rem,3.5vw,1.05rem);white-space:normal;overflow-wrap:anywhere;line-height:1.25}#step>button{margin:8px auto;display:block}.app{overflow:hidden}@media(max-width:340px){.options{gap:5px}.options button{font-size:1.35rem;padding:10px 2px}.actions{gap:6px}} .instructions{text-align:left;background:#25262c;color:#f4f4f6;border-radius:16px;padding:16px;margin:12px 0;font-size:.91rem;line-height:1.55;max-height:43dvh;overflow-y:auto}.instructions p{font-size:inherit}.instructions ul{padding-left:22px}.instructions li{margin:10px 0}.instructions h3{font-size:1rem;margin:16px 0 8px}.instructions b{color:white} #games-panel{margin-top:14px;text-align:left;background:#f4ecff;border-radius:18px;padding:14px 18px}#games-panel h2{font-size:1.15rem;margin:0 0 10px}#games-panel ul{margin:0;padding-left:22px}#games-panel li{margin-bottom:12px;line-height:1.5;font-size:.96rem}#games-panel li:last-child{margin-bottom:0}</style></head><body><main class="app"><h1>Meet Purple I-Rock Mini! 💜</h1><div class="buddy wave" id="buddy" aria-label="Happy purple cartoon monster waving"><svg viewBox="0 0 240 270" role="img" aria-label="Cute purple monster"><ellipse cx="120" cy="250" rx="77" ry="12" fill="#a995cf" opacity=".3"/><path d="M76 72 Q42 35 58 16 Q91 20 104 66 M140 66 Q153 20 183 16 Q200 40 165 74" fill="#aa79e8" stroke="#7041b0" stroke-width="5"/><ellipse cx="120" cy="148" rx="83" ry="100" fill="#9a6ae4" stroke="#7041b0" stroke-width="5"/><ellipse cx="120" cy="181" rx="55" ry="52" fill="#c3a0f5"/><ellipse cx="89" cy="122" rx="22" ry="29" fill="white"/><ellipse cx="153" cy="122" rx="22" ry="29" fill="white"/><circle cx="95" cy="126" r="10" fill="#34224c"/><circle cx="148" cy="126" r="10" fill="#34224c"/><circle cx="98" cy="121" r="4" fill="white"/><circle cx="151" cy="121" r="4" fill="white"/><ellipse cx="120" cy="151" rx="10" ry="7" fill="#7543b8"/><path d="M99 170 Q120 196 143 170" fill="none" stroke="#542c7d" stroke-width="7" stroke-linecap="round"/><circle cx="69" cy="157" r="12" fill="#ec98c5" opacity=".8"/><circle cx="174" cy="157" r="12" fill="#ec98c5" opacity=".8"/><path d="M52 168 Q16 149 20 127 Q27 115 45 135 L70 154" fill="#9a6ae4" stroke="#7041b0" stroke-width="5"/><g id="paw"><path d="M188 163 Q219 131 211 100 Q203 88 192 114 Q202 86 189 85 Q179 85 177 111 Q177 84 164 92 Q159 99 163 126 L171 161" fill="#9a6ae4" stroke="#7041b0" stroke-width="5" stroke-linejoin="round"/></g><ellipse cx="80" cy="241" rx="27" ry="14" fill="#8050c4"/><ellipse cx="158" cy="241" rx="27" ry="14" fill="#8050c4"/></svg></div><p id="status" aria-live="polite">Hello, my friend! I'm the Purple I-Rock Mini! 👋</p><section id="step"><button id="start">Tap to say hello! 🔊</button></section><div class="actions"><button class="secondary" id="games" type="button">🎮 Games and Modes</button><button class="secondary" id="dance">💃 Dance!</button><button class="secondary" id="again">↻ Start again</button></div><p class="small">Grown-up tip: sound starts after a tap. We don't save names or recordings.</p></main><script>
const buddy=document.getElementById('buddy'),status=document.getElementById('status'),step=document.getElementById('step');
function cartoonVoice(){const voices=speechSynthesis.getVoices();const english=voices.filter(v=>/^en[-_]/i.test(v.lang));return english.find(v=>/Google US English|Microsoft Ana|Microsoft Aria|Samantha|Karen/i.test(v.name))||english.find(v=>/natural|premium|enhanced/i.test(v.name))||english[0]||null}
let childName='friend';function say(words){status.textContent=words;if('speechSynthesis'in window){speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(words);const preferred=cartoonVoice();if(preferred)utterance.voice=preferred;utterance.rate=0.9;utterance.pitch=1.34;utterance.volume=1;speechSynthesis.speak(utterance)}}
function feelings(){say('How are you feeling today, '+childName+'?');step.innerHTML='<div class="options"><button data-mood="happy">😊<span>Happy</span></button><button data-mood="sad">🥺<span>Sad</span></button><button data-mood="excited">🤩<span>Excited</span></button></div><button id="skip">Skip</button>';step.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>react(b.dataset.mood));document.getElementById('skip').onclick=()=>react('happy')}
function react(mood){const replies={happy:'Yay! Your smile makes me happy!',sad:'Sending you a big, gentle hug!',excited:'Woohoo! Let us celebrate!'};say(replies[mood]);step.innerHTML='<button id="celebrate">Dance with me! 🎉</button>';document.getElementById('celebrate').onclick=dance}
function dance(){buddy.className='buddy dance';say('Dance party! Wiggle, wiggle, wiggle!');setTimeout(()=>{buddy.className='buddy wave'},3800)}
function nameStep(){
 step.innerHTML='<p id="listenstatus" aria-live="polite">Purple I-Rock Mini is speaking...</p><label for="name">Your name (if the microphone does not work)</label><input id="name" maxlength="24" autocomplete="off" placeholder="Type your name"><div class="actions"><button id="retry">🎤 Try listening again</button><button class="secondary" id="skipname">Skip</button></div>';
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 let recognition=null,finished=false;
 const greetingParts=[
 'Hello my friend! My name is the Purple I-Rock Mini.',
 'iRock Mini – Activation Instructions.',
 'Congratulations on unboxing the world’s most advanced, eco-friendly entertainment system. Follow these steps to activate your new device.',
 'Step 1: Power On. Hold your iRock Mini. Look closely at it. It is now fully powered on and ready for adventure.',
 'Step 2: Sync to Brain. Tap the iRock gently to your forehead for 3 seconds to sync its imagination drive.',
 'Step 3: Name Your Device. Give your iRock a custom username, like Rocky 3000 or The Boulder-Dash.',
 'What is your name?'
 ];
 const greeting=greetingParts.join(' ');
 function advance(n){if(finished)return;finished=true;if(recognition){recognition.onend=null;recognition.abort()}childName=(n||'').trim().replace(/[^a-zA-ZÀ-ÿ '-]/g,'').slice(0,24)||'friend';say('Hello '+childName+'! Let us have some fun. Let us tap the buttons below!');step.innerHTML='<div class="options"><button data-mood="happy">😊<span>Happy</span></button><button data-mood="sad">🥺<span>Sad</span></button><button data-mood="excited">🤩<span>Excited</span></button></div><button id="skip">Skip</button>';step.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>react(b.dataset.mood));document.getElementById('skip').onclick=()=>react('happy')}
 function askName(){const el=document.getElementById('listenstatus');if(el)el.textContent='Listening for your name...';listen()}
 function listen(){if(finished)return;const label=document.getElementById('listenstatus');if(!SR){label.textContent='Voice recognition is not available here. Type your name instead.';return}if(recognition)recognition.abort();recognition=new SR();recognition.lang='en-ZA';recognition.interimResults=false;recognition.maxAlternatives=1;recognition.continuous=false;recognition.onresult=e=>advance(e.results[0][0].transcript);recognition.onerror=e=>{if(finished)return;const el=document.getElementById('listenstatus');if(el)el.textContent='I did not catch that. Try speaking again, or type your name.'};recognition.onend=()=>{if(finished)return;const el=document.getElementById('listenstatus');if(el&&el.textContent==='Listening... tell me your name!')el.textContent='I am still here! Tap Try listening again, or type your name.'};try{recognition.start();label.textContent='Listening... tell me your name!'}catch(e){label.textContent='Microphone unavailable. Type your name instead.'}}
 const input=document.getElementById('name');input.addEventListener('keydown',e=>{if(e.key==='Enter')advance(input.value)});input.addEventListener('change',()=>{if(input.value.trim())advance(input.value)});
 document.getElementById('retry').onclick=listen;document.getElementById('skipname').onclick=()=>advance('friend');
 // Begin listening automatically after the spoken introduction has finished.
 // Some browsers require separate microphone permission; the retry button is a fallback.
 if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(greeting);u.voice=cartoonVoice();u.rate=0.9;u.pitch=1.34;u.onend=()=>{if(!finished)askName()};u.onerror=()=>{if(!finished)askName()};status.textContent='Hello my friend! My name is the Purple I-Rock Mini. Let me tell you how to activate your iRock!';speechSynthesis.speak(u)}else{status.textContent=greeting;askName()}
}
const gameModes=[
 ['Stealth Mode','Place the iRock on a shelf. It will completely blend into its surroundings. It is virtually invisible to parents.'],
 ['Freeze Tag Mode','Play freeze tag with your iRock. Warning: The iRock is the reigning world champion at this game. It never loses.'],
 ['Sleep Mode','Place the iRock inside its box. It will instantly enter deep-sleep mode. It will not make a sound all night.']
];
document.getElementById('games').onclick=()=>{
 if('speechSynthesis'in window)window.speechSynthesis.cancel();
 status.textContent='🎮 Built-In Games & Modes';
 let panel=document.getElementById('games-panel');
 if(!panel){panel=document.createElement('section');panel.id='games-panel';panel.setAttribute('aria-label','Built-In Games and Modes');document.getElementById('games').closest('.actions').insertAdjacentElement('afterend',panel)}
 panel.innerHTML='<h2>🎮 Built-In Games & Modes</h2><ul>'+gameModes.map(([name,desc])=>'<li><strong>'+name+':</strong> '+desc+'</li>').join('')+'</ul>';
 if('speechSynthesis'in window){
  const synth=window.speechSynthesis;const voice=cartoonVoice();
  const lines=['Built-In Games and Modes.',...gameModes.map(([name,desc])=>name+'. '+desc)];
  let index=0;const next=()=>{if(index>=lines.length)return;const u=new SpeechSynthesisUtterance(lines[index++]);if(voice)u.voice=voice;u.rate=0.9;u.pitch=1.34;u.onend=()=>setTimeout(next,350);synth.speak(u)};next();
 }
};
document.getElementById('start').onclick=nameStep;document.getElementById('dance').onclick=dance;document.getElementById('again').onclick=()=>{childName='friend';if('speechSynthesis'in window)window.speechSynthesis.cancel();buddy.className='buddy wave';say('Hello, my friend! My name is the Purple I-Rock Mini!');step.innerHTML='<button id="start">Tap to say hello! 🔊</button>';document.getElementById('start').onclick=nameStep};
</script></body></html>
